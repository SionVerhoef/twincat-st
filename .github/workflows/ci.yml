name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: reviewer loads and lists its rules
        run: python3 scripts/st_review.py --list-rules

      # The skill's own templates must survive the skill's own reviewer. If this
      # fails, either a template regressed or a rule became wrong - both matter.
      - name: templates pass the reviewer they ship with
        run: python3 scripts/st_review.py templates/ --fail-on high

      # The other half of the gate: quiet-on-good-code cannot catch a rule that has
      # silently stopped detecting. This asserts every rule still fires, that the
      # known false positives stay fixed, and that tcpou.py round trips byte-exact.
      - name: every rule still detects its defect
        run: python3 tests/run_tests.py

      - name: every example file parses
        run: |
          python3 scripts/tcpou.py check \
            examples/*/*.TcPOU examples/*/*.TcIO examples/*/*.TcDUT examples/*/*.TcGVL

      # The grader decides whether the skill looks like it works, so it gets the same
      # treatment as the reviewer: a gold run must score full marks and a null run must
      # score zero. Without this a check that passes for free reads as a win.
      - name: eval grader is calibrated
        run: python3 evals/selftest.py

      - name: eval grader is runnable
        # No run directory is present in CI, so it reports every eval as missing
        # and exits 0. This catches a syntax error or a bad default path.
        run: python3 evals/grade.py

      - name: fixture project has its documented baseline
        # Exactly three high-severity findings, all inside FB_Filler.DoseComplete. If
        # this drifts, every artifact eval is grading against the wrong original.
        run: |
          n=$(python3 scripts/st_review.py evals/fixture-project --json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["summary"]["high"])')
          [ "$n" = "3" ] || { echo "expected 3 high findings, got $n"; exit 1; }

      - name: standalone contract
        # Nothing may point outside this repository, and no private-repo branding
        # may leak into it. The bracket around the first letter stops each pattern
        # matching this file, which would fail the check against its own source.
        run: |
          ! grep -rn '\.\./\.\.' --include='*.md' --include='*.py' . || exit 1
          ! grep -rniE '[s]olvera|certified [b]eckhoff' . || exit 1
          ! grep -rnE '/[h]ome/|/[p]rojects/|[C]:\\Users' \
              --include='*.md' --include='*.py' --include='*.yml' . || exit 1
          # No guard against naming twincat-scope: that companion is published, so
          # the README's link to it is accurate. What must never appear is a path
          # into a sibling checkout, which the absolute-path check above covers.

      - name: examples keep their upstream licences
        # MIT and BSD-2 both require the notice to travel with the files.
        run: |
          for d in examples/*/; do
            [ -f "$d/LICENSE" ] || { echo "missing LICENSE in $d"; exit 1; }
          done
